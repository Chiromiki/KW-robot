<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Militærroboter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="room">

        -- Milo nederst til venstre --
        <div id="milo">
            <img src="milo.png" alt="Milo robot"id="milo">
            <div class="bubble" id="milo-text">
                -- Tekst kommer her --
            </div>
        </div>

        -- Hovedroboten (det store bildet) --
        <!-- Kilde til bilde: https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/MQ-9_Reaper_UAV_%28cropped%29.jpg/960px-MQ-9_Reaper_UAV_%28cropped%29.jpg -->
        <div id="main-robot">
            <img src="UAVDrone.jpg" alt="Hovedrobot" id="big-robot"id="UAVDrone">
        </div>

         -- De 3 små bildene du klikker på --
        <div class="robot-thumbs">
             <!-- Kilde: https://www.forsvaret.dk/da/materiel2/bomberobot/ -->
            <img src="Bombe og minefjerner.jpg" alt="Robot 1"id="bombe-minefjerner">
            <!-- Kilde: https://www.passengerterminaltoday.com/news/security/bordeaux-airport-deploys-perimeter-patrol-robot-to-train-ai-surveillance-algorithms.html -->
            <img src="Patruljerobot.jpg " alt="Robot 2"id="patruljerobot">
            <!-- Kilde: : https://www.militarytimes.com/news/your-military/2020/04/22/us-adds-military-surveillance-cameras-at-mexico-border-despite-drop-in-crossings/ -->
            <img src="Overvåkningskamera.jpg " alt="Robot 3"id="overvåkningskamera">

    </main>
