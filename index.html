<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inngang</title>
    <link rel="stylesheet" href="CSS/common.css">
    <link rel="stylesheet" href="CSS/index.css">
</head>
<body>

    <!--sliding doors-->
    <div class="sliding_doors">   
        
        <input type="checkbox" id="title_sign_trigger">
        <div class="title_sign">
        <label for="title_sign_trigger" id="title_sign_label">
            <img id= "title_sign_img" src="Medier/index_og_main/title_sign.png" alt="et skilt der det står ROBOTER: om og av clankers">
        </label>
        </div>

        <img id="sliding_door_side" src="Medier/index_og_main/side_doors.png" alt="utsiden av et museum med skyvende dører">
        <img id="sliding_door_left" src="Medier/index_og_main/left_sliding_door.png" alt="venstredel av en automatisk skyvedør">
        <img id="sliding_door_right" src="Medier/index_og_main/right_sliding_door.png" alt="høyredel av en automaisk skyvedør">
        
    </div>
    
    <!--snakkeboble-->
    <div class="snakkeboble_1">
        <input type="checkbox" id="speech_bubble_1_trigger">
        <label for="speech_bubble_1_trigger" id="speech_bubble_1_label">
            Velkommen til Robotmuseet!
            Mitt navn er Milo og jeg skal veilede deg gjennom denne spennende og kunnskapsrike reisen om oss roboter! 
            <br>
            <br>
            Klikk på snakkeboblen min for å fortsette.
        </label>
    </div>

    <div class="snakkeboble_2">
        <input type="checkbox" id="speech_bubble_2_trigger">
        <label for="speech_bubble_2_trigger" id="speech_bubble_2_label">
            Hovre over rommene for å se hvor du kan gå! Vi har også en liten guidebok spredt over gulvene der du kan gå til det neste anbefalte rommet. Vi har en på gulvet her også om du ikke vet hvor du skal starte!
            <br>
            <br>
            Du kan når som helst gå tilbake til dette hovedrommet ved å klikke på en blå "MAIN" som henger på alle rommene! Om du føler deg ferdig med omvisningen, kan du også gå til utgangen ved å klikke på en grønn "EXIT" knapp. Jeg dømmer ikke!
        </label>
    </div>

    <!--dører-->
    <a href="Militaer.html" class="door_1"></a>
    <a href="" class="door_2"></a>
    <a href="" class="door_3"></a>
    <a href="" class="door_4"></a>
    <a href="" class="door_5"></a>

    <!--guidebook-->
    <a href="Historierommet.html" class="guidebook">
        <img src="Medier/index_og_main/guide.png" id="guidebook_img" alt="en lyseblå brosjyre der det står GUIDEBOK: FØLG ROBOTEN på forsiden">
    </a>
    
    <!--bakgrunn-->
    <div class="main_container">
        <img src="Medier/index_og_main/entree.jpg" id="background_img" alt="bakgrunnsbilde for entreen, består av 5 dører som fører til forskjellige rom">
        
        <!--robot-->
        
        <div class="robot_container">
            <div class="robot">
                <div id="speech_bubble_1"></div>
                <img id="robot_front" src="Medier/index_og_main/milo_front_default.png" alt="En robotguide med lysegrå øyne, antenne og lys rundt magen">
            </div>
        </div>
        
    </div>
</body>
</html>
